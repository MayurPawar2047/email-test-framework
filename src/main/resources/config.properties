# ---------------------------------------------------------------------------
# Default configuration. NEVER put secrets in this file.
# Provide secrets via environment variables or a git-ignored config-local.properties:
#   MAILOSAUR_API_KEY=...      (mailosaur.api.key)
#   MAILOSAUR_SERVER_ID=...    (mailosaur.server.id)
# ---------------------------------------------------------------------------

# Mailosaur (domain defaults to <serverId>.mailosaur.net when not set)
# mailosaur.server.domain=

# How long to wait for an email to arrive. Mailosaur only matches mail received
# in the last hour, so in fallback mode the email must be fresh.
email.timeout.ms=20000

# Delete every message on the server before the suite starts
email.clear.before.suite=false

# Directory attachments are downloaded to
email.download.dir=target/downloads

# ---- How tests obtain an email -------------------------------------------
# Mode A (recommended): the framework POSTs {"email": "<unique address>"} to this URL
#                       to make the app under test send a fresh email.
# app.trigger.url=https://qa.example.com/api/send-transaction-email
#
# Mode B (fallback):    when app.trigger.url is empty, tests read an email that is
#                       ALREADY in the inbox for this recipient local-part.
email.fixed.recipient=anything

# ---- Expectations used by the sample tests (blank = test is skipped) -----
expect.subject=Transaction Alert: Funds Transfer Successful


expect.attachment.type=application/pdf



expect.link.contains=example.com/transaction
expect.attachment.name=dummy_bank_statement.pdf
expect.otp.regex=(?i)your otp is\\D*(\\d{8})
expect.sender=mayurpawar2400@gmail.com
expect.body.text=Dear Customer
link.ignore.hosts=example.com